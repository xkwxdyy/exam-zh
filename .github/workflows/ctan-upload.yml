name: Publish to CTAN

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit to CTAN"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ctan-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    if: github.repository == 'xkwxdyy/exam-zh'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages

      - name: Check release metadata
        run: >-
          python3 scripts/check-ctan-release.py
          --tag "${{ inputs.tag }}"
          --announcement-output build/ctan-announcement.md

      - name: Restore published manual PDFs
        env:
          GH_TOKEN: ${{ github.token }}
          CTAN_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p build/release-assets
          gh release download "$CTAN_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "exam-zh-${CTAN_TAG}.zip" \
            --dir build/release-assets
          asset="build/release-assets/exam-zh-${CTAN_TAG}.zip"
          unzip -p "$asset" exam-zh-doc.pdf > doc/exam-zh-doc.pdf
          unzip -p "$asset" exam-zh-doc-basic.pdf > doc-basic/exam-zh-doc-basic.pdf

      - name: Verify restored manuals
        run: >-
          test -s doc/exam-zh-doc.pdf
          && test -s doc-basic/exam-zh-doc-basic.pdf

      - name: Run regression tests and build CTAN archive
        run: l3build ctan --halt-on-error --show-log-on-error

      - name: Save regression failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctan-regression-failure-${{ inputs.tag }}
          path: |
            build/test/*.diff
            build/test/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Inspect CTAN archive
        run: >-
          python3 scripts/check-ctan-release.py
          --tag "${{ inputs.tag }}"
          --archive exam-zh.zip

      - name: Validate submission with CTAN
        run: >-
          l3build upload --dry-run
          --file build/ctan-announcement.md

      - name: Save reviewed upload inputs
        uses: actions/upload-artifact@v4
        with:
          name: ctan-${{ inputs.tag }}
          path: |
            exam-zh.zip
            build/ctan-announcement.md
          if-no-files-found: error
          retention-days: 30

  upload:
    name: Upload archive
    needs: build
    runs-on: ubuntu-latest
    environment: ctan
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install l3build
        uses: zauguin/install-texlive@v4
        with:
          packages: scheme-basic l3build

      - name: Download reviewed upload inputs
        uses: actions/download-artifact@v4
        with:
          name: ctan-${{ inputs.tag }}

      - name: Require explicit CTAN environment opt-in
        env:
          CTAN_UPLOAD_ENABLED: ${{ vars.CTAN_UPLOAD_ENABLED }}
        run: test "${CTAN_UPLOAD_ENABLED}" = "true"

      - name: Upload to CTAN
        env:
          L3BUILD_CTAN_UPLOAD: "true"
        run: >-
          l3build upload
          --file build/ctan-announcement.md
