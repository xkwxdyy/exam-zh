name: Publish to CTAN

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit to CTAN"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ctan-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate published archive
    if: github.repository == 'xkwxdyy/exam-zh'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: scheme-basic l3build

      - name: Check release metadata
        run: >-
          python3 scripts/check-ctan-release.py
          --tag "${{ inputs.tag }}"
          --announcement-output build/ctan-announcement.md

      - name: Download published CTAN archive
        env:
          GH_TOKEN: ${{ github.token }}
          CTAN_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$CTAN_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "exam-zh.zip" \
            --dir .

      - name: Inspect CTAN archive
        run: >-
          python3 scripts/check-ctan-release.py
          --tag "${{ inputs.tag }}"
          --archive exam-zh.zip

      - name: Validate submission with CTAN
        run: |
          set -o pipefail
          l3build upload --dry-run \
            --file build/ctan-announcement.md 2>&1 \
            | tee build/ctan-validation.log
          grep -Fq "CTAN validation successful" build/ctan-validation.log
          if grep -Eq "WARNING|ERROR" build/ctan-validation.log; then
            echo "CTAN validation returned a warning or error" >&2
            exit 1
          fi

      - name: Record archive checksum
        run: sha256sum exam-zh.zip | tee build/ctan-sha256.txt

      - name: Save reviewed upload inputs
        uses: actions/upload-artifact@v7
        with:
          name: ctan-${{ inputs.tag }}
          path: |
            exam-zh.zip
            build/ctan-announcement.md
            build/ctan-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove validation form data
        if: always()
        run: rm -f exam-zh.curlopt

  upload:
    name: Upload published archive
    needs: validate
    runs-on: ubuntu-latest
    environment: ctan
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install l3build
        uses: zauguin/install-texlive@v4
        with:
          packages: scheme-basic l3build

      - name: Download reviewed upload inputs
        uses: actions/download-artifact@v8
        with:
          name: ctan-${{ inputs.tag }}

      - name: Verify reviewed archive checksum
        run: sha256sum --check build/ctan-sha256.txt

      - name: Require explicit CTAN environment opt-in
        env:
          CTAN_UPLOAD_ENABLED: ${{ vars.CTAN_UPLOAD_ENABLED }}
        run: test "${CTAN_UPLOAD_ENABLED}" = "true"

      - name: Upload to CTAN
        env:
          L3BUILD_CTAN_UPLOAD: "true"
        run: |
          set -o pipefail
          l3build upload \
            --file build/ctan-announcement.md 2>&1 \
            | tee build/ctan-upload.log
          grep -Fq "Upload succeeded" build/ctan-upload.log
          if grep -Eq "WARNING|ERROR" build/ctan-upload.log; then
            echo "CTAN upload returned a warning or error" >&2
            exit 1
          fi

      - name: Remove upload form data
        if: always()
        run: rm -f exam-zh.curlopt
