name: Publish to CTAN

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit to CTAN"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ctan-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    if: github.repository == 'xkwxdyy/exam-zh'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
          # Older release tags predate CI manual builds, so keep these additions
          # in the workflow instead of requiring a rewritten public tag.
          packages: >-
            accsupp alphalph amsfonts booktabs caption colortbl csquotes fancyvrb
            hologo hypdoc lm lstaddons makecell mnsymbol ninecolors psnfss
            threeparttable tipa underscore xcolor-material xpinyin
            xunicode zhlipsum zref

      - name: Check release metadata
        run: >-
          python3 scripts/check-ctan-release.py
          --tag "${{ inputs.tag }}"
          --announcement-output build/ctan-announcement.md

      - name: Build manuals
        run: make doc doc-basic

      - name: Run regression tests and build CTAN archive
        run: l3build ctan

      - name: Inspect CTAN archive
        run: >-
          python3 scripts/check-ctan-release.py
          --tag "${{ inputs.tag }}"
          --archive exam-zh.zip

      - name: Validate submission with CTAN
        run: >-
          l3build upload --dry-run
          --file build/ctan-announcement.md

      - name: Save reviewed upload inputs
        uses: actions/upload-artifact@v4
        with:
          name: ctan-${{ inputs.tag }}
          path: |
            exam-zh.zip
            build/ctan-announcement.md
          if-no-files-found: error
          retention-days: 30

  upload:
    name: Upload archive
    needs: build
    runs-on: ubuntu-latest
    environment: ctan
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install l3build
        uses: zauguin/install-texlive@v4
        with:
          packages: scheme-basic l3build

      - name: Download reviewed upload inputs
        uses: actions/download-artifact@v4
        with:
          name: ctan-${{ inputs.tag }}

      - name: Require explicit CTAN environment opt-in
        env:
          CTAN_UPLOAD_ENABLED: ${{ vars.CTAN_UPLOAD_ENABLED }}
        run: test "${CTAN_UPLOAD_ENABLED}" = "true"

      - name: Upload to CTAN
        env:
          L3BUILD_CTAN_UPLOAD: "true"
        run: >-
          l3build upload
          --file build/ctan-announcement.md
